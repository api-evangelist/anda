name: Anda
description: >-
  Anda (andaafrica.com) is an Angolan mobility and delivery company that operates
  ride-hailing and courier services using motorcycles, electric motorcycles, and
  tuk-tuks, integrating technology, finance, and sustainability to serve people and
  businesses across Angola. Anda runs a drive-to-own model that empowers drivers to
  own their vehicles through training (ANDA Academia), insurance, maintenance support,
  and safe operating hubs, turning informal transport work into stable livelihoods.
  Moto-taxi rides are fulfilled through the Yango app, alongside green electric-motorcycle
  options, tuk-tuk transport, and express delivery. The company is based in Talatona,
  Angola, and is a portfolio company of Speedinvest (invested 2025). Anda does not
  currently publish any public API or developer documentation; this profile captures
  the verified company identity and domain-security posture.
